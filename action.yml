name: 'Dependabot YouTrack'
description: 'Creates a YouTrack issue for every Dependabot PR'
author: 'your-org'

inputs:
  youtrack-url:
    description: 'Base URL of the YouTrack instance (e.g. https://youtrack.example.com)'
    required: true
  youtrack-token:
    description: 'Permanent token for YouTrack API auth'
    required: true
  project:
    description: 'YouTrack project name or short name'
    required: true
  subproject:
    description: 'Value for the SubProject custom field'
    required: true
  stage:
    description: 'Value for the Stage custom field'
    required: true
  type:
    description: 'Value for the Type custom field'
    required: true
  state:
    description: 'Value for the State custom field'
    required: true
  assignee:
    description: 'YouTrack login for the Assignee field'
    required: false
    default: ''
  priority:
    description: 'Value for the Priority custom field'
    required: true
  codebase:
    description: 'Value for the CodeBase custom field'
    required: false
    default: ''

runs:
  using: 'node20'
  main: 'dist/index.js'
